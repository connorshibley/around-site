# NOT ACTIVE. This is a ready-made GitHub Actions workflow, kept here for later.
# The site is currently published with `npm run deploy` (scripts/deploy-pages.sh).
# To have GitHub rebuild and publish by itself on every push to main:
#   1. run:  gh auth refresh -h github.com -s workflow   (approve in the browser)
#   2. move this file to .github/workflows/deploy.yml, commit and push
#   3. on GitHub: Settings > Pages > Source: GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # A project page lives at https://<user>.github.io/<repository>/
          SITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
